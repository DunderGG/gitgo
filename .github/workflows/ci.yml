name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # Ubuntu 24.04 only ships webkit2gtk 4.1; Wails needs this tag to link against it.
  LINUX_BUILD_TAGS: webkit2_41

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev

      # main.go embeds frontend/dist, which is gitignored. The Go checks don't
      # need the real bundle, so a placeholder is enough to compile.
      - name: Create placeholder frontend bundle
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep

      - name: Set build tags
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            echo "GOFLAGS=-tags=$LINUX_BUILD_TAGS" >> "$GITHUB_ENV"
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev

      # The TypeScript bindings in frontend/wailsjs are generated by the Wails
      # CLI and gitignored, so they must be regenerated before type-checking.
      # The CLI version is taken from go.mod so the two never drift apart.
      - name: Install Wails CLI
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"

      - name: Generate Wails bindings
        run: |
          mkdir -p frontend/dist && touch frontend/dist/.gitkeep
          wails generate module -tags "$LINUX_BUILD_TAGS"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type-check
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npx vite build
